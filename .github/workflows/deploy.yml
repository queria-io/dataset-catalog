name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  repository_dispatch:
    types: [dataset-updated]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 全体所要は約 28 分（pull の DuckDB->SQLite 変換 約 4.5 分 + dbt 約 7 分
    # + push の SQLite->DuckDB 変換 約 16 分）で 30 分では余裕がなく、
    # 数分の揺れで timeout し cancelled になる。変換時間の短縮は別途対応。
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      # queria は誰のデータセットに書くのかをトークンから決める。R2 の鍵は渡さない
      QUERIA_TOKEN: ${{ secrets.QUERIA_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13

      # queria はベータ開発中のため、常に最新版を使用する
      - run: uv lock --upgrade-package queria && uv sync

      - name: Sync catalog
        run: scripts/build.sh

  notify-failure:
    runs-on: ubuntu-latest
    needs: deploy
    # timeout-minutes 超過時の deploy の conclusion は failure ではなく cancelled になる
    if: failure() || needs.deploy.result == 'cancelled'
    steps:
      - name: Notify Discord on failure
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\": [{\"title\": \"Deploy Failed\", \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"color\": 15158332, \"fields\": [{\"name\": \"Repository\", \"value\": \"${{ github.repository }}\"}, {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\"}, {\"name\": \"Commit\", \"value\": \"${{ github.sha }}\"}]}]}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
